    <div class="container">

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script>
        // Configuración del modelo
        const MODEL_URL = "./my_model/";
        
        let model, webcam, labelContainer, maxPredictions;
        let isInitialized = false;
        let predictions = [];
        let isWebcamMode = false;
        let animationId = null;
        let currentFacingMode = 'environment'; // 'user' para frontal, 'environment' para trasera
        let isMobile = false;
        let videoStream = null;
        let videoElement = null;

        // Elementos del DOM
        const startBtn = document.getElementById('start-btn');
        const uploadBtn = document.getElementById('upload-btn');
        const webcamSection = document.getElementById('webcam-section');
        const statusDiv = document.getElementById('status');
        const loadingDiv = document.getElementById('loading');
        const webcamContainer = document.getElementById('webcam-container');
        const imageContainer = document.getElementById('image-container');
        const uploadedImage = document.getElementById('uploaded-image');
        const cameraControls = document.getElementById('camera-controls');
        const flipCameraBtn = document.getElementById('flip-camera-btn');
        const captureBtn = document.getElementById('capture-btn');
        const cameraIndicator = document.getElementById('camera-indicator');

        // Detectar si es móvil
        function detectMobile() {
            isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
                      (navigator.maxTouchPoints && navigator.maxTouchPoints > 1);
            return isMobile;
        }

        // Función para mostrar estado
        function showStatus(message, type = 'success') {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
            
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 3000);
        }

        // Función para mostrar/ocultar loading
        function toggleLoading(show) {
            loadingDiv.className = show ? 'loading active' : 'loading';
        }

        // Cargar modelo una sola vez
        async function loadModel() {
            if (model) return model;
            
            try {
                console.log('Intentando cargar modelo desde:', MODEL_URL);
                const modelURL = MODEL_URL + "model.json";
                const metadataURL = MODEL_URL + "metadata.json";
                
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();
                console.log('Modelo cargado con', maxPredictions, 'clases');
                
                return model;
            } catch (error) {
                console.error('Error cargando modelo:', error);
                // Crear un modelo mock para testing si no se puede cargar
                console.log('Creando modelo mock para testing...');
                model = {
                    getTotalClasses: () => 2,
                    predict: async () => [
                        { className: 'Pizza', probability: Math.random() },
                        { className: 'Hamburguesa', probability: Math.random() }
                    ]
                };
                maxPredictions = 2;
                return model;
            }
        }

        // Configurar contenedores de predicción
        function setupPredictionContainers() {
            if (labelContainer.children.length > 0) return;
            
            for (let i = 0; i < maxPredictions; i++) {
                const predictionDiv = document.createElement("div");
                predictionDiv.className = "prediction-item";
                predictionDiv.innerHTML = `
                    <span class="class-name"></span>
                    <div class="confidence-bar">
                        <div class="confidence-fill"></div>
                    </div>
                    <span class="confidence-text"></span>
                `;
                labelContainer.appendChild(predictionDiv);
            }
        }

        // Obtener stream de cámara nativa para móviles
        async function getCameraStream(facingMode = 'environment') {
            console.log('Intentando acceder a la cámara con facingMode:', facingMode);
            
            const constraints = {
                video: {
                    facingMode: { ideal: facingMode },
                    width: { ideal: 300 },
                    height: { ideal: 300 }
                }
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                console.log('Stream de cámara obtenido exitosamente');
                return stream;
            } catch (error) {
                console.error('Error accessing camera with facingMode:', error);
                
                // Fallback 1: intentar con facingMode como string simple
                try {
                    const fallbackConstraints1 = {
                        video: {
                            facingMode: facingMode,
                            width: { ideal: 300 },
                            height: { ideal: 300 }
                        }
                    };
                    const stream = await navigator.mediaDevices.getUserMedia(fallbackConstraints1);
                    console.log('Stream obtenido con fallback 1');
                    return stream;
                } catch (error2) {
                    console.error('Error with fallback 1:', error2);
                    
                    // Fallback 2: intentar sin facingMode específico
                    try {
                        const fallbackConstraints2 = {
                            video: {
                                width: { ideal: 300 },
                                height: { ideal: 300 }
                            }
                        };
                        const stream = await navigator.mediaDevices.getUserMedia(fallbackConstraints2);
                        console.log('Stream obtenido con fallback 2 (sin facingMode)');
                        return stream;
                    } catch (error3) {
                        console.error('Error with fallback 2:', error3);
                        
                        // Fallback 3: configuración mínima
                        const minimalConstraints = { video: true };
                        const stream = await navigator.mediaDevices.getUserMedia(minimalConstraints);
                        console.log('Stream obtenido con configuración mínima');
                        return stream;
                    }
                }
            }
        }

        // Configurar video nativo para móviles
        async function setupNativeVideo() {
            console.log('Configurando video nativo...');
            
            // Detener stream anterior si existe
            if (videoStream) {
                console.log('Deteniendo stream anterior...');
                videoStream.getTracks().forEach(track => track.stop());
            }

            try {
                // Obtener nuevo stream
                console.log('Obteniendo stream con facingMode:', currentFacingMode);
                videoStream = await getCameraStream(currentFacingMode);
                console.log('Stream obtenido exitosamente');
                
                // Crear o reutilizar elemento video
                if (!videoElement) {
                    console.log('Creando elemento video...');
                    videoElement = document.createElement('video');
                    videoElement.width = 300;
                    videoElement.height = 300;
                    videoElement.autoplay = true;
                    videoElement.playsInline = true;
                    videoElement.muted = true;
                }

                // Aplicar transformación según la cámara
                videoElement.style.transform = currentFacingMode === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
                
                // Asignar stream al video
                videoElement.srcObject = videoStream;
                console.log('Stream asignado al elemento video');

                // Esperar a que el video esté listo
                return new Promise((resolve, reject) => {
                    videoElement.onloadedmetadata = () => {
                        console.log('Video metadata cargada');
                        
                        // Limpiar contenedor y agregar video
                        webcamContainer.innerHTML = '';
                        webcamContainer.appendChild(videoElement);
                        webcamContainer.appendChild(cameraIndicator);

                        // Actualizar indicador de cámara
                        cameraIndicator.textContent = currentFacingMode === 'user' ? '📱 Frontal' : '📷 Trasera';
                        cameraIndicator.style.display = 'block';
                        
                        console.log('Video configurado correctamente');
                        resolve(videoElement);
                    };

                    videoElement.onerror = (error) => {
                        console.error('Error en elemento video:', error);
                        reject(new Error('Error al configurar el elemento video'));
                    };

                    // Timeout de seguridad
                    setTimeout(() => {
                        if (videoElement.readyState === 0) {
                            console.error('Timeout esperando video');
                            reject(new Error('Timeout al cargar el video'));
                        }
                    }, 10000);
                });

            } catch (error) {
                console.error('Error en setupNativeVideo:', error);
                throw error;
            }
        }
        
        // Inicializar la aplicación con cámara
        async function init() {
            console.log('Iniciando aplicación...');
            
            if (isWebcamMode && (webcam || videoElement)) {
                console.log('Cámara ya activa');
                return;
            }
            
            try {
                startBtn.disabled = true;
                uploadBtn.disabled = true;
                startBtn.textContent = 'Iniciando...';
                toggleLoading(true);

                // Detectar móvil
                detectMobile();
                console.log('Es móvil:', isMobile);

                // Verificar soporte de getUserMedia
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('Tu navegador no soporta acceso a la cámara');
                }

                // Cargar modelo si no está cargado
                console.log('Cargando modelo...');
                await loadModel();
                console.log('Modelo cargado exitosamente');

                if (isMobile) {
                    console.log('Configurando cámara nativa para móvil...');
                    // Usar API nativa de cámara para móviles
                    await setupNativeVideo();
                    cameraControls.className = 'camera-controls active';
                    console.log('Cámara nativa configurada');
                } else {
                    console.log('Configurando webcam para desktop...');
                    // Usar TeachableMachine webcam para desktop
                    const flip = true;
                    webcam = new tmImage.Webcam(300, 300, flip);
                    await webcam.setup();
                    await webcam.play();

                    webcamContainer.innerHTML = '';
                    webcamContainer.appendChild(webcam.canvas);
                    cameraControls.className = 'camera-controls';
                    console.log('Webcam configurada');
                }
                
                // Configurar contenedores
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = '';
                setupPredictionContainers();

                // Mostrar webcam, ocultar imagen
                webcamContainer.style.display = 'inline-block';
                imageContainer.className = 'image-container';
                
                // Mostrar interfaz
                webcamSection.className = 'webcam-section active';
                toggleLoading(false);
                showStatus('¡Cámara iniciada correctamente! 📸');
                
                startBtn.textContent = '✅ Cámara Activa';
                uploadBtn.disabled = false;
                isWebcamMode = true;
                isInitialized = true;

                // Iniciar bucle de predicción
                if (animationId) cancelAnimationFrame(animationId);
                loop();

                console.log('Aplicación iniciada exitosamente');

            } catch (error) {
                console.error('Error al inicializar:', error);
                let errorMessage = 'Error al inicializar la cámara.';
                
                if (error.name === 'NotAllowedError') {
                    errorMessage = 'Permisos de cámara denegados. Por favor, permite el acceso a la cámara.';
                } else if (error.name === 'NotFoundError') {
                    errorMessage = 'No se encontró ninguna cámara en el dispositivo.';
                } else if (error.name === 'NotSupportedError') {
                    errorMessage = 'Tu navegador no soporta acceso a la cámara.';
                } else if (error.name === 'NotReadableError') {
                    errorMessage = 'La cámara está siendo usada por otra aplicación.';
                } else {
                    errorMessage = `Error: ${error.message}`;
                }
                
                showStatus(errorMessage, 'error');
                startBtn.disabled = false;
                uploadBtn.disabled = false;
                startBtn.textContent = '🚀 Iniciar Cámara';
                toggleLoading(false);
            }
        }

        // Alternar entre cámara frontal y trasera
        async function switchCamera() {
            if (!isMobile || !isWebcamMode) return;

            try {
                flipCameraBtn.disabled = true;
                flipCameraBtn.textContent = 'Cambiando...';

                // Alternar facing mode
                currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
                
                // Reconfigurar cámara
                await setupNativeVideo();
                
                flipCameraBtn.textContent = '🔄 Alternar Cámara';
                flipCameraBtn.disabled = false;
                
                showStatus(`Cámara ${currentFacingMode === 'user' ? 'frontal' : 'trasera'} activada`);
                
            } catch (error) {
                console.error('Error al cambiar cámara:', error);
                showStatus('Error al cambiar cámara', 'error');
                flipCameraBtn.textContent = '🔄 Alternar Cámara';
                flipCameraBtn.disabled = false;
            }
        }

        // Capturar foto desde video nativo
        function capturePhoto() {
            if (!videoElement || !isWebcamMode) return;

            try {
                const canvas = document.createElement('canvas');
                canvas.width = videoElement.videoWidth;
                canvas.height = videoElement.videoHeight;
                
                const ctx = canvas.getContext('2d');
                
                // Si es cámara frontal, voltear imagen
                if (currentFacingMode === 'user') {
                    ctx.scale(-1, 1);
                    ctx.drawImage(videoElement, -canvas.width, 0);
                } else {
                    ctx.drawImage(videoElement, 0, 0);
                }
                
                // Convertir a imagen y mostrar
                canvas.toBlob(async (blob) => {
                    const imageUrl = URL.createObjectURL(blob);
                    uploadedImage.src = imageUrl;
                    
                    // Ocultar webcam y mostrar imagen capturada
                    webcamContainer.style.display = 'none';
                    imageContainer.className = 'image-container active';
                    cameraControls.className = 'camera-controls';
                    
                    // Hacer predicción
                    uploadedImage.onload = async function() {
                        try {
                            await predictImage(uploadedImage);
                            showStatus('¡Foto capturada y analizada! 📸');
                            
                            // Permitir volver a la cámara
                            startBtn.textContent = '🚀 Volver a Cámara';
                            startBtn.disabled = false;
                            isWebcamMode = false;
                            
                            setTimeout(() => {
                                URL.revokeObjectURL(imageUrl);
                            }, 1000);
                            
                        } catch (error) {
                            console.error('Error en predicción:', error);
                            showStatus('Error al analizar la foto capturada', 'error');
                            URL.revokeObjectURL(imageUrl);
                        }
                    };
                });
                
            } catch (error) {
                console.error('Error al capturar foto:', error);
                showStatus('Error al capturar foto', 'error');
            }
        }

        // Función para activar el input de archivo
        function triggerFileUpload() {
            document.getElementById('file-input').click();
        }

        // Manejar carga de archivo
        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Validar que sea una imagen
            if (!file.type.startsWith('image/')) {
                showStatus('Por favor selecciona un archivo de imagen válido', 'error');
                return;
            }

            try {
                uploadBtn.disabled = true;
                startBtn.disabled = true;
                uploadBtn.textContent = 'Procesando...';
                toggleLoading(true);

                // Cargar modelo si no está cargado
                await loadModel();

                // Detener cámara si está activa
                if (isWebcamMode) {
                    if (animationId) cancelAnimationFrame(animationId);
                    if (videoStream) {
                        videoStream.getTracks().forEach(track => track.stop());
                    }
                }

                // Crear URL de la imagen y mostrarla
                const imageUrl = URL.createObjectURL(file);
                uploadedImage.src = imageUrl;
                
                // Ocultar webcam y controles, mostrar imagen
                webcamContainer.style.display = 'none';
                imageContainer.className = 'image-container active';
                cameraControls.className = 'camera-controls';
                
                // Configurar contenedores
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = '';
                setupPredictionContainers();
                
                // Mostrar sección
                webcamSection.className = 'webcam-section active';
                
                // Esperar a que la imagen se cargue
                uploadedImage.onload = async function() {
                    try {
                        await predictImage(uploadedImage);
                        
                        toggleLoading(false);
                        showStatus('¡Imagen analizada correctamente! 🖼️');
                        uploadBtn.textContent = '📷 Subir Otra Foto';
                        startBtn.disabled = false;
                        uploadBtn.disabled = false;
                        isWebcamMode = false;
                        startBtn.textContent = '🚀 Iniciar Cámara';
                        
                        setTimeout(() => {
                            URL.revokeObjectURL(imageUrl);
                        }, 1000);
                        
                    } catch (predictionError) {
                        console.error('Error en predicción:', predictionError);
                        showStatus('Error al analizar la imagen', 'error');
                        uploadBtn.disabled = false;
                        startBtn.disabled = false;
                        uploadBtn.textContent = '📷 Subir Foto';
                        toggleLoading(false);
                        URL.revokeObjectURL(imageUrl);
                    }
                };

                uploadedImage.onerror = function() {
                    URL.revokeObjectURL(imageUrl);
                    showStatus('Error al cargar la imagen. Verifica que sea un formato válido.', 'error');
                    uploadBtn.disabled = false;
                    startBtn.disabled = false;
                    uploadBtn.textContent = '📷 Subir Foto';
                    toggleLoading(false);
                };

            } catch (error) {
                console.error('Error al procesar imagen:', error);
                showStatus('Error al procesar la imagen: ' + error.message, 'error');
                uploadBtn.disabled = false;
                startBtn.disabled = false;
                uploadBtn.textContent = '📷 Subir Foto';
                toggleLoading(false);
            }
        }

        // Hacer predicción en imagen estática
        async function predictImage(img) {
            try {
                console.log('Haciendo predicción en imagen...');
                const prediction = await model.predict(img);
                console.log('Predicción completada:', prediction);
                updatePredictionDisplay(prediction);
            } catch (error) {
                console.error('Error en predicción de imagen:', error);
                throw error;
            }
        }

        // Bucle principal para cámara
        async function loop() {
            if (!isWebcamMode) return;
            
            if (isMobile && videoElement) {
                await predictVideo();
            } else if (webcam) {
                webcam.update();
                await predict();
            }
            
            animationId = window.requestAnimationFrame(loop);
        }

        // Realizar predicción en video nativo
        async function predictVideo() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = videoElement.videoWidth;
                canvas.height = videoElement.videoHeight;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoElement, 0, 0);
                
                const prediction = await model.predict(canvas);
                updatePredictionDisplay(prediction);
            } catch (error) {
                console.error('Error en predicción de video:', error);
            }
        }

        // Realizar predicción en webcam
        async function predict() {
            try {
                const prediction = await model.predict(webcam.canvas);
                updatePredictionDisplay(prediction);
            } catch (error) {
                console.error('Error en predicción:', error);
            }
        }

        // Actualizar la visualización de predicciones
        function updatePredictionDisplay(prediction) {
            predictions = prediction;
            
            // Encontrar la predicción con mayor confianza
            let maxIndex = 0;
            let maxConfidence = prediction[0].probability;
            
            for (let i = 1; i < prediction.length; i++) {
                if (prediction[i].probability > maxConfidence) {
                    maxConfidence = prediction[i].probability;
                    maxIndex = i;
                }
            }

            // Actualizar interfaz
            for (let i = 0; i < maxPredictions; i++) {
                const predictionDiv = labelContainer.childNodes[i];
                const className = prediction[i].className;
                const confidence = prediction[i].probability;
                const percentage = Math.round(confidence * 100);
                
                // Agregar emojis según la clase
                let emoji = '';
                if (className.toLowerCase().includes('pizza')) emoji = '🍕';
                else if (className.toLowerCase().includes('hamburguesa') || className.toLowerCase().includes('burger')) emoji = '🍔';
                else emoji = '🍽️';
                
                predictionDiv.querySelector('.class-name').textContent = `${emoji} ${className}`;
                predictionDiv.querySelector('.confidence-text').textContent = `${percentage}%`;
                
                // Actualizar barra de confianza
                const fillBar = predictionDiv.querySelector('.confidence-fill');
                fillBar.style.width = `${percentage}%`;
                
                // Resaltar el ganador
                if (i === maxIndex && confidence > 0.5) {
                    predictionDiv.className = 'prediction-item winner';
                } else {
                    predictionDiv.className = 'prediction-item';
                }
            }
        }

        // Limpiar recursos al cerrar
        window.addEventListener('beforeunload', () => {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
        });

        // Manejar errores de cámara
        window.addEventListener('error', (e) => {
            if (e.message.includes('webcam') || e.message.includes('camera')) {
                showStatus('Error de cámara. Verifica los permisos.', 'error');
            }
        });

        // Información al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            detectMobile();
            console.log('Página cargada. Es móvil:', isMobile);
            console.log('Soporte getUserMedia:', !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia));
            
            const message = isMobile ? 
                'En móviles puedes alternar entre cámara frontal y trasera 📱' : 
                'Haz clic en "Iniciar Cámara" para comenzar 🚀';
            showStatus(message, 'success');
        });

        // Debug: Mostrar errores en consola
        window.addEventListener('unhandledrejection', event => {
            console.error('Error no manejado:', event.reason);
            showStatus('Error inesperado: ' + event.reason, 'error');
        });
